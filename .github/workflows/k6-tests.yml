name: k6 Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike

permissions:
  contents: read
  checks: write

jobs:
  k6:
    name: Run k6 Scenario
    runs-on: ubuntu-latest

    steps:
      - name: Checkout k6-performance-tests
        uses: actions/checkout@v7

      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build movie-catalog-api
        run: ./mvnw package -DskipTests -q
        working-directory: movie-catalog-api

      - name: Start movie-catalog-api
        run: |
          cp target/movie-catalog-api-*.jar app.jar
          docker build -f Dockerfile.ci -t movie-catalog-api .
          rm app.jar
          docker compose up -d
        working-directory: movie-catalog-api

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/movies > /dev/null; then
              echo "API ready after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 - retrying in 5s..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose logs --tail=100
          exit 1
        working-directory: movie-catalog-api

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 scenario
        run: |
          SCENARIO=${{ github.event.inputs.scenario || 'smoke' }}
          k6 run dist/${SCENARIO}.js -e BASE_URL=http://localhost:8080

      - name: Upload k6 summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary-${{ github.event.inputs.scenario || 'smoke' }}
          path: summary.json
          retention-days: 30
